<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Topper Sewing Machine Shopping</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    margin:0;
    padding:0;
}

body{
    background:#f0f2f5;
    padding-bottom:90px;
}

header{
    background:linear-gradient(135deg,#1a237e,#0d47a1);
    color:white;
    padding:15px 12px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand-title{
    font-size:20px;
    font-weight:900;
    letter-spacing:1px;
    color:#ffab00;
    text-transform:uppercase;
    text-shadow:1px 1px 2px rgba(0,0,0,.5);
    text-align:left;
}

.brand-subtitle{
    font-size:11px;
    color:#e0e0e0;
    margin-top:2px;
    text-align:left;
}

.auth-header-btn{
    background:#fff;
    color:#1a237e;
    border:none;
    padding:6px 12px;
    border-radius:20px;
    font-weight:bold;
    font-size:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
}

.auth-header-btn:disabled{
    opacity:.7;
}

.user-pic{
    width:25px;
    height:25px;
    border-radius:50%;
    object-fit:cover;
}

.banner{
    background:#283593;
    color:white;
    padding:12px;
    text-align:center;
    border-bottom:3px solid #ffab00;
}

.banner h2{
    font-size:16px;
}

.banner p{
    font-size:12px;
    opacity:.9;
    margin-top:3px;
}
